version: 1
unit: iterations_per_second

source:
  type: prometheus
  baseUrl: https://prometheus-REGION.grafana.net/api/prom
  query: sum(rate(http_requests_total[5m]))
  auth:
    mode: basic
    usernameEnv: PROMETHEUS_USERNAME
    passwordEnv: PROMETHEUS_PASSWORD

window:
  days: 14
  stepSeconds: 300

analysis:
  baselinePercentile: 75
  peakPercentile: 99
  minimumCoverageRatio: 0.9
  minimumSamples: 1000
  eventMadMultiplier: 6
  minimumEventBuckets: 3
  busyHoursTop: 5
