version: 1

target:
  name: controlled-local-lab
  baseUrl: http://127.0.0.1:3000
  authorized: true

objective:
  type: validate_expected_peak

volume:
  unit: iterations_per_second
  oneIterationModelsOneOperation: true
  discoveryProfile: artifacts/discovery/workload-profile.json
  discoveryRequired: true
  discoveryMinimumConfidence: MEDIUM
  activeUsers: 1000
  operationsPerUser: 3
  observationWindowSeconds: 600
  observedPeakRate: 15
  headroomPercent: 25
  explorationCeilingMultiplier: 4

environment:
  comparisonMode: equivalent
  minimumCapacityRatio: 1
  production:
    replicas: 1
    cpuCoresPerReplica: 2
    memoryMbPerReplica: 2048
  test:
    replicas: 1
    cpuCoresPerReplica: 2
    memoryMbPerReplica: 2048
  configurationParity:
    databaseTopologyEquivalent: true
    cacheTopologyEquivalent: true
    networkPathEquivalent: true
    autoscalingEquivalent: true

observability:
  applicationMetrics: true
  infrastructureMetrics: true
  logs: true
  traces: true
  dependencyMetrics: true

nfr:
  p95Ms: 500
  p99Ms: 1000
  errorRate: 0.01
  checkRate: 0.99
  apdexTMs: 500
  apdexMin: 0.85

generator:
  vuSafetyFactor: 1.5
