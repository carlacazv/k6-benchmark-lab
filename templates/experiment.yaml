# Copy this template into experiments/<hypothesis>.yaml.
# The built-in runner intentionally allows fault injection only against the repository-owned local lab.
schemaVersion: 1
experiment:
  id: my-hypothesis
  hypothesis: "Changing one controlled variable causes a material change in the selected performance metric under the same workload."
  protocol: rest
  trials: 3
  environment:
    LAB_BASE_LATENCY_MS: 15
    LAB_JITTER_MS: 0
    LAB_DEPENDENCY_LATENCY_MS: 0
    LAB_DB_WAIT_MS: 0
    LAB_CPU_BURN_MS: 0
    LAB_ERROR_RATE: 0
  intervention:
    # Allowed examples: LAB_DEPENDENCY_LATENCY_MS, LAB_DB_WAIT_MS, LAB_CPU_BURN_MS, LAB_ERROR_RATE
    variable: LAB_DEPENDENCY_LATENCY_MS
    control: 0
    treatment: 120
  workload:
    vus: 4
    iterations: 40
  expected:
    # Supported metrics include p95_ms and other metrics implemented by the experiment core.
    metric: p95_ms
    direction: increase
    minimumRelativeChange: 0.5
    minimumAbsoluteChange: 70
    requiredConsistency: 0.67
  safety:
    target: local
    maxTreatmentValue: 500
    maxDurationSeconds: 30
