schemaVersion: 1
experiment:
  id: dependency-latency
  hypothesis: "Increasing simulated downstream latency increases REST request p95 under the same workload."
  protocol: rest
  trials: 3
  environment:
    LAB_BASE_LATENCY_MS: 15
    LAB_JITTER_MS: 0
    LAB_DEPENDENCY_LATENCY_MS: 0
    LAB_DB_WAIT_MS: 0
    LAB_CPU_BURN_MS: 0
    LAB_ERROR_RATE: 0
  intervention:
    variable: LAB_DEPENDENCY_LATENCY_MS
    control: 0
    treatment: 120
  workload:
    vus: 4
    iterations: 40
  expected:
    metric: p95_ms
    direction: increase
    minimumRelativeChange: 0.5
    minimumAbsoluteChange: 70
    requiredConsistency: 0.67
  safety:
    target: local
    maxTreatmentValue: 500
    maxDurationSeconds: 30
