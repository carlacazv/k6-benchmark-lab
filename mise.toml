[tools]
node = "24"
k6 = "2.2.0"

[env]
TARGET_BASE_URL = "http://127.0.0.1:3000"
SCENARIO = "smoke"
K6_REPORT_DIR = "artifacts/manual"
PERFORMANCE_PLAN = "performance-test-plan.yaml"
TELEMETRY_DISCOVERY_CONFIG = "telemetry-discovery.yaml"
TELEMETRY_CORRELATION_CONFIG = "telemetry-correlation.yaml"
EXPERIMENT_CONFIG = "experiments/dependency-latency.yaml"
OBSERVABILITY_CORRELATION_CONFIG = "observability-correlation.yaml"
PROMETHEUS_CONFIG = "observability/prometheus.yml"
PROMETHEUS_IMAGE = "prom/prometheus:v3.5.0"

[tasks.setup]
description = "Install pinned toolchain"
run = "mise install"

[tasks.lab]
description = "Start the local instrumented study target"
run = "node lab-app/server.mjs"

[tasks.discover]
description = "Discover production workload from telemetry and generate a workload profile"
run = "node scripts/discover.mjs ${TELEMETRY_DISCOVERY_CONFIG} --out-dir artifacts/discovery"

[tasks.readiness]
description = "Validate the performance plan, load telemetry discovery, compare environments and recommend a scenario"
run = "node scripts/readiness.mjs ${PERFORMANCE_PLAN} --scenario auto --out-dir artifacts/readiness"

[tasks.rest]
description = "Run REST performance test with granular time-series capture"
run = "node scripts/run-k6-with-window.mjs tests/rest/performance.js ${K6_REPORT_DIR} rest"

[tasks.graphql]
description = "Run GraphQL performance test with granular time-series capture"
run = "node scripts/run-k6-with-window.mjs tests/graphql/performance.js ${K6_REPORT_DIR} graphql"

[tasks.frontend]
description = "Run frontend/browser performance test with granular time-series capture"
run = "node scripts/run-k6-with-window.mjs tests/browser/performance.js ${K6_REPORT_DIR} browser"

[tasks.case-planning-poker-readiness]
description = "Validate the safe local Planning Poker use-case plan"
run = "node scripts/readiness.mjs use-cases/planning-poker/performance-test-plan.yaml --scenario smoke --out-dir artifacts/use-cases/planning-poker/readiness"

[tasks.case-planning-poker-smoke]
description = "Run the Planning Poker end-to-end k6/browser smoke against an authorized local target"
run = "K6_BROWSER_HEADLESS=true K6_REPORT_DIR=artifacts/use-cases/planning-poker/browser node scripts/run-k6-with-window.mjs use-cases/planning-poker/browser-smoke.js artifacts/use-cases/planning-poker/browser browser"

[tasks.case-planning-poker-baseline]
description = "Run the controlled Planning Poker Socket.IO baseline: 1 room x 5 participants = 5 VUs"
run = "PP_SCENARIO=baseline SCENARIO=baseline ROOMS=1 PARTICIPANTS_PER_ROOM=5 ARRIVAL_WINDOW_MS=0 K6_REPORT_DIR=artifacts/use-cases/planning-poker/baseline node scripts/run-k6-with-window.mjs use-cases/planning-poker/socketio-workload.js artifacts/use-cases/planning-poker/baseline socketio"

[tasks.case-planning-poker-load]
description = "Run the controlled Planning Poker Socket.IO load: 4 rooms x 5 participants = 20 VUs"
run = "PP_SCENARIO=load SCENARIO=load ROOMS=4 PARTICIPANTS_PER_ROOM=5 ARRIVAL_WINDOW_MS=10000 K6_REPORT_DIR=artifacts/use-cases/planning-poker/load node scripts/run-k6-with-window.mjs use-cases/planning-poker/socketio-workload.js artifacts/use-cases/planning-poker/load socketio"

[tasks.case-planning-poker-stress]
description = "Run the controlled Planning Poker Socket.IO stress: 10 rooms x 5 participants = 50 VUs"
run = "PP_SCENARIO=stress SCENARIO=stress ROOMS=10 PARTICIPANTS_PER_ROOM=5 ARRIVAL_WINDOW_MS=15000 K6_REPORT_DIR=artifacts/use-cases/planning-poker/stress node scripts/run-k6-with-window.mjs use-cases/planning-poker/socketio-workload.js artifacts/use-cases/planning-poker/stress socketio"

[tasks.case-planning-poker-spike]
description = "Run the controlled Planning Poker Socket.IO spike: 20 rooms x 5 participants = 100 VUs"
run = "PP_SCENARIO=spike SCENARIO=spike ROOMS=20 PARTICIPANTS_PER_ROOM=5 ARRIVAL_WINDOW_MS=1000 K6_REPORT_DIR=artifacts/use-cases/planning-poker/spike node scripts/run-k6-with-window.mjs use-cases/planning-poker/socketio-workload.js artifacts/use-cases/planning-poker/spike socketio"

[tasks.correlate]
description = "Correlate exact k6 test windows with application/infrastructure telemetry"
run = "node scripts/correlate.mjs ${TELEMETRY_CORRELATION_CONFIG} --artifacts artifacts --out-dir artifacts/correlation"

[tasks.experiment]
description = "Run a paired controlled performance experiment and classify the RCA hypothesis"
run = "node scripts/experiment.mjs ${EXPERIMENT_CONFIG} --out-dir artifacts/experiments/manual"

[tasks.observability]
description = "Validate k6 -> real Prometheus telemetry -> correlation -> hypothesis in the owned lab (requires Docker)"
run = "node scripts/observability-validation.mjs ${OBSERVABILITY_CORRELATION_CONFIG} --out-dir artifacts/observability"

[tasks.validate-chain]
description = "Align the real telemetry hypothesis with the separate controlled experiment evidence"
run = "node scripts/validate-evidence-chain.mjs artifacts/observability/correlation/telemetry-correlation.json artifacts/experiments/default/experiment-report.json --out-dir artifacts/observability"

[tasks.analyze]
description = "Generate diagnosis from k6 summary artifacts"
run = "node scripts/analyze-results.mjs artifacts artifacts/performance-diagnosis.md artifacts/performance-diagnosis.json"

[tasks.suite]
description = "Discover telemetry, run readiness, execute k6, correlate telemetry, run a controlled experiment and diagnose"
run = "bash scripts/run-suite.sh auto"

[tasks.ci-smoke]
description = "Run discovery + readiness + safe smoke + synthetic correlation + controlled experiment + diagnosis"
run = "bash scripts/run-suite.sh smoke"

[tasks.full-validation]
description = "Run the safe smoke path plus real Prometheus observability and evidence-chain validation (requires Docker)"
run = "RUN_REAL_OBSERVABILITY=1 bash scripts/run-suite.sh smoke"

[tasks.release-qc]
description = "Validate the v1 public documentation, templates, local links and release version"
run = "npm run release:qc"

[tasks.test]
description = "Run framework tests plus the v1 release/documentation contract"
run = "npm test"
